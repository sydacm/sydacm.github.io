# Checks content/ and publishes the website every time something changes.
# If a check fails, the live site stays as it was and this run turns red
# with a message saying which file and line to fix.
name: Build and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab
  schedule:
    - cron: "0 14 * * *"    # daily at ~midnight Sydney, so "Updated" and past events stay current

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check content and build
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
